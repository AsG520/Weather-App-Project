<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-main-page.css" />
    <link rel="icon" type="image/x-icon" href="logo.jpg" />
    <title>Weather App - v.2026</title>
  </head>
  <body>
    <div class="container">
      <form class="weatherForm">
        <div class="search-details">
          <input
            type="search"
            id="search"
            placeholder="   Enter your location"
          />
          <img src="search.png" height="25" width="25" id="search-picture" />
        </div>
        <br />
        <div class="header-details">
          <img
            src="location.png"
            height="45"
            width="50"
            id="location-picture"
          />
          <h1 id="location-display">Location</h1>
        </div>
        <div id="temperature-and-celsius-details">
          <input
            type="number"
            id="temperature-display"
            readonly
            value="0"
          /><span style="font-size: 25px; font-weight: 750">°C</span>
        </div>
        <br />
        <label id="description">Description of weather!</label>
        <br />
        <label id="weather-emoji">🌏</label>
        <div class="bottom-layout">
          <div id="humidity-details">
            <div id="humidity-picture-and-label">
              <figure>
                <img
                  src="humidity.png"
                  height="50"
                  width="50"
                  id="humidity-picture"
                />
              </figure>
              <figcaption>Humidity (%)</figcaption>
              <input
                type="number"
                id="humidity-percentage"
                readonly
                value="0"
              />
            </div>
          </div>
          <div id="wind-details">
            <div id="wind-picture-and-label">
              <figure>
                <img src="wind.png" height="50" width="50" id="wind-picture" />
              </figure>
              <figcaption>Wind Speed (km/h)</figcaption>
              <input
                type="number"
                id="wind-kilometers-per-hour"
                readonly
                value="0"
              />
            </div>
          </div>
          <div id="pressure-details">
            <div id="pressure-picture-and-label">
              <figure>
                <img
                  src="pressure.png"
                  height="50"
                  width="50"
                  id="pressure-picture"
                />
              </figure>
              <figcaption>Pressure (kPa)</figcaption>
              <input type="number" id="pressure-value" readonly value="0" />
            </div>
          </div>
        </div>
      </form>
    </div>
    <script type="module" src="firebaseauth.js"></script>
    <script src="function-main-page.js"></script>
  </body>
</html>
