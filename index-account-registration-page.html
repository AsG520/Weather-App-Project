<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-account-registration-page.css" />
    <title>Account Registration Page of Weather App - v.2026</title>
  </head>
  <body>
    <div class="container">
      <h1>Account Registration</h1>
      <form>
        <div id="first-name-details">
          <input
            type="text"
            id="first-name-field"
            placeholder="Enter your first name"
            required
          />
          <img src="user-picture.png" height="25" width="25" />
        </div>
        <br />
        <div id="email-address-details">
          <input
            type="text"
            id="email-address-field"
            placeholder="Enter your email address"
            required
          />
          <img src="user-picture.png" height="25" width="25" />
        </div>
        <br />
        <div id="email-password-details">
          <input
            type="password"
            id="email-password-field"
            placeholder="Enter your password"
            required
          />
          <img src="padlock-picture.png" height="25" width="25" />
        </div>
        <br />
        <input type="button" id="sign-up" value="Sign Up" />
        <br />
        <br />
        <img src="google-logo.png" height="40" width="40" />
        <br />
        <br />
        <label
          >Already have an account!
          <span style="text-decoration-line: underline" id="login-word"
            >Login</span
          ></label
        >
      </form>
    </div>
    <script type="module" src="firebaseauth.js"></script>
    <script src="function-account-registration-page.js"></script>
  </body>
</html>
