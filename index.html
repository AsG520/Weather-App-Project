<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cabin:ital,wght@0,400..700;1,400..700&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Google+Sans+Code:ital,wght,MONO@0,300..800,1;1,300..800,1&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Press+Start+2P&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="logo.jpg" />
    <title>Login Page of Weather App - v.2026</title>
  </head>
  <body>
    <div class="container">
      <h1>Login</h1>
      <form>
        <div id="username-details">
          <input
            type="text"
            id="username-field"
            placeholder="Enter your username"
            required
          />
          <img
            src="user-picture.png"
            height="25"
            width="25"
            id="user-picture"
          />
        </div>
        <br />
        <div id="password-details">
          <input
            type="password"
            id="password-field"
            placeholder="Enter your password"
            required
          />
          <img
            src="padlock-picture.png"
            height="25"
            width="25"
            id="padlock-picture"
          />
        </div>
        <br />
        <div id="remember-and-forgot-layout">
          <div id="remember-me-details">
            <input type="checkbox" id="checkbox" />
            <label id="remember-me-word">Remember me</label>
          </div>
          <label id="forgot-password-word">Forgot Password?</label>
        </div>
        <br />
        <input type="button" value="Login" id="login" />
      </form>
      <img src="google-logo.png" height="40" width="40" id="google-logo" />
      <br />
      <label
        >Don't have an account? <span id="register-word">Register</span></label
      >
    </div>
    <script type="module" src="firebaseauth.js"></script>
    <script src="function.js"></script>
  </body>
</html>
